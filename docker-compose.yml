services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Logical replication for zero-cache. This file is also the BASE that
    # infra/docker-compose.acceptance.yml overrides, so setting it here is what
    # gives the acceptance stack the same replication capability as prod —
    # without it, any sync-level acceptance check would pass vacuously against
    # a publication that can never stream.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidestage}
      POSTGRES_USER: ${POSTGRES_USER:-sidestage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - sidestage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY:-dev-typesense-key} --listen-port 8108 --enable-cors"
    ports:
      - "8108:8108"
    volumes:
      - sidestage-typesense:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sidestage-redis:/data

  mediamtx:
    image: bluenviron/mediamtx:1.13.1
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_HOST:-localhost}
    ports:
      - "8889:8889"
      - "8189:8189/udp"

volumes:
  sidestage-postgres:
  sidestage-typesense:
  sidestage-redis:
