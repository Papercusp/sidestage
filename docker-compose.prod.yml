# SideStage production stack — /opt/SideStage on the shared Hetzner box,
# modeled on the Restart deploy pattern (rsync + compose + Traefik on the
# external `coolify` network) but a COMPLETELY INDEPENDENT project: own
# containers, own volumes, own hostname. Never touches the restart-* stack.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# .env.production lives only on the box (POSTGRES_PASSWORD, TYPESENSE_API_KEY,
# PUBLIC_HOSTNAME=sidestage.buyrestart.com, …). No secrets in the repo.
name: sidestage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # zero-cache replicates via LOGICAL replication; the stock image ships
    # wal_level=replica, under which `zero_publication` exists but never
    # streams a single row. Postgres reports this ONLY as a warning at CREATE
    # PUBLICATION time, so the symptom in prod is a sync that connects fine and
    # stays permanently empty. Changing wal_level requires a postgres RESTART
    # (not a reload) — see infra/zero/README.md.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidestage}
      POSTGRES_USER: ${POSTGRES_USER:-sidestage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
    volumes:
      - sidestage-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/seed/demo.sql:/docker-entrypoint-initdb.d/20-demo.sql:ro
      # FIRST-INIT ONLY — the prod volume already exists, so this mount will
      # NOT create the publication there. It must be applied explicitly once:
      #   docker compose exec -T postgres psql -U sidestage -d sidestage \
      #     < db/zero-publication.sql
      - ./db/zero-publication.sql:/docker-entrypoint-initdb.d/30-zero-publication.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:?set in .env.production}"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sidestage-typesense:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - sidestage-redis:/data

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    environment:
      # MediaMTX 1.9.3 copies additional hosts directly into ICE candidates;
      # it does not resolve DNS names. A hostname here makes Firefox discard
      # the candidate and leaves only Docker-private addresses in the answer.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_PUBLIC_IP:?set to the server public IPv4 in .env.production}
      # Keep direct UDP as the low-latency path, but give browsers on networks
      # that block arbitrary UDP/high ports an authenticated TURN fallback.
      # Traefik terminates TURNS on a dedicated DNS-only hostname/443 and sends
      # the decrypted TURN/TCP stream to the `turn` service below. Keeping TURN
      # on its own SNI avoids relying on absent-ALPN matching, which Traefik's
      # Docker provider can route to the HTTP service instead.
      MTX_WEBRTCICESERVERS2_0_URL: turns:turn.${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}:443?transport=tcp
      MTX_WEBRTCICESERVERS2_0_USERNAME: AUTH_SECRET
      MTX_WEBRTCICESERVERS2_0_PASSWORD: ${TURN_AUTH_SECRET:?set in .env.production}
      # MediaMTX is on the same host as coturn and can reach its relay ports
      # locally. Only browsers need to allocate through TURN.
      MTX_WEBRTCICESERVERS2_0_CLIENTONLY: "yes"
    ports:
      - "8189:8189/udp"   # WebRTC ICE
    depends_on:
      - turn
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.sidestage-media.rule=Host(`media.${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}`)
      - traefik.http.routers.sidestage-media.entrypoints=https
      - traefik.http.routers.sidestage-media.tls.certresolver=letsencrypt
      - traefik.http.services.sidestage-media.loadbalancer.server.port=8889

  turn:
    image: coturn/coturn:4.15.0-r0
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --no-udp
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_AUTH_SECRET:?set in .env.production}
      - --realm=media.${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}
      - --external-ip=${MEDIAMTX_PUBLIC_IP:?set to the server public IPv4 in .env.production}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --stale-nonce=600
      - --log-file=stdout
    # Relay allocations stay authenticated. Publishing the bounded range lets
    # MediaMTX reach browser relay candidates through the host's Docker NAT;
    # the provider firewall can continue blocking these ports from the public
    # internet because browsers use the TURNS/TCP control connection on 443.
    ports:
      - "49160-49200:49160-49200/udp"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      # TURN has a dedicated SNI, so routing never depends on whether a client
      # advertises ALPN and cannot steal media.<host> WHIP/WHEP HTTP traffic.
      - "traefik.tcp.routers.sidestage-turn.rule=HostSNI(`turn.${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}`)"
      - traefik.tcp.routers.sidestage-turn.entrypoints=https
      - traefik.tcp.routers.sidestage-turn.tls=true
      - traefik.tcp.routers.sidestage-turn.tls.certresolver=letsencrypt
      - traefik.tcp.services.sidestage-turn.loadbalancer.server.port=3478

  api:
    # Tagged per-sha so a previous release stays recoverable after a rebuild
    # (deploy/rollback.sh selects one by setting SIDESTAGE_SHA). Defaults to
    # :latest, so an un-exported var behaves exactly as before.
    image: sidestage-api:${SIDESTAGE_SHA:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        SIDESTAGE_SHA: ${SIDESTAGE_SHA:-unknown}
    restart: unless-stopped
    # DELIBERATELY no `ports:` -- the api is EXPOSED but never PUBLISHED to the
    # host. Traefik reaches container port 3100 over the `coolify` network (see
    # the traefik.* labels below), so publishing it would add host surface the
    # architecture does not need. A deploy health probe must therefore use the
    # PUBLIC url, not a host loopback port; see deploy/deploy.sh's health_probe.
    environment:
      NODE_ENV: production
      # Production's internal contract is :3100 (Traefik, Zero and deploy
      # health probes all target it). Keep this explicit: the application
      # fallback is the local-development port and may change independently.
      API_PORT: 3100
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-sidestage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidestage}
      DATA_BACKEND: pg
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set in .env.production}
      TYPESENSE_EMBEDDING_PROVIDER: none
      EASYPOST_API_KEY: ${EASYPOST_API_KEY:?set in .env.production}
      WAREHOUSE_FROM_NAME: ${WAREHOUSE_FROM_NAME:-SideStage}
      WAREHOUSE_FROM_STREET1: ${WAREHOUSE_FROM_STREET1:?set in .env.production}
      WAREHOUSE_FROM_CITY: ${WAREHOUSE_FROM_CITY:?set in .env.production}
      WAREHOUSE_FROM_STATE: ${WAREHOUSE_FROM_STATE:?set in .env.production}
      WAREHOUSE_FROM_ZIP: ${WAREHOUSE_FROM_ZIP:?set in .env.production}
      WAREHOUSE_FROM_COUNTRY: ${WAREHOUSE_FROM_COUNTRY:-US}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set in .env.production}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?set in .env.production}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set in .env.production}
      SIDESTAGE_AUCTION_SIGNING_SECRET: ${SIDESTAGE_AUCTION_SIGNING_SECRET:?set in .env.production}
      # PUBLIC base, not a compose-internal alias: the API serves this URL to
      # browsers and mobile clients as `playbackUrl` (D-035), so it must be the
      # address THEY can dial — same host the web bakes into VITE_MEDIAMTX_URL.
      MEDIAMTX_WHEP_URL: https://media.${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?set in .env.production}
      # Optional: blank values keep the provider-independent deterministic
      # Copilot active. Production may inject all three without rebuilding.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SIDESTAGE_COPILOT_MODEL: ${SIDESTAGE_COPILOT_MODEL:-}
      # Optional Vertex configuration (Scout, Copilot, Judge and the transcript
      # product-focus classifier share the gate).
      # A blank project keeps the tested deterministic engines; location/model
      # blanks use the factory defaults. The credentials path points inside the
      # container at the ./secrets read-only mount below.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      SCOUT_VERTEX_MODEL: ${SCOUT_VERTEX_MODEL:-}
      SIDESTAGE_COPILOT_VERTEX_MODEL: ${SIDESTAGE_COPILOT_VERTEX_MODEL:-}
      SIDESTAGE_JUDGE_VERTEX_MODEL: ${SIDESTAGE_JUDGE_VERTEX_MODEL:-}
      # Blank falls back to SIDESTAGE_COPILOT_VERTEX_MODEL, then the factory default.
      SIDESTAGE_PRODUCT_FOCUS_VERTEX_MODEL: ${SIDESTAGE_PRODUCT_FOCUS_VERTEX_MODEL:-}
    volumes:
      # Hand-placed credential files (Vertex service-account key). Prod-side
      # state: deploy.sh excludes /secrets from the rsync --delete sweep.
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_started
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.sidestage-api.rule=Host(`${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}`) && (PathPrefix(`/api`) || Path(`/healthz`))
      - traefik.http.routers.sidestage-api.entrypoints=https
      - traefik.http.routers.sidestage-api.tls.certresolver=letsencrypt
      - traefik.http.services.sidestage-api.loadbalancer.server.port=3100

  # WebSocket sync server (Rocicorp Zero). Browsers hold a long-lived WS to
  # /zero on the public hostname; this container replicates Postgres into a
  # local SQLite replica and serves the view-syncer from it. Queries and
  # mutations are NOT resolved here — they delegate back to the api over
  # ZERO_QUERY_URL / ZERO_MUTATE_URL, which is why no schema file is baked in.
  zero-cache:
    image: sidestage-zero-cache:${SIDESTAGE_SHA:-latest}
    build:
      context: .
      dockerfile: infra/zero/Dockerfile
    restart: unless-stopped
    environment:
      # Upstream = the database of record. CHANGE db is the same instance here;
      # zero keeps its bookkeeping in the zero_0 schema alongside the app data.
      ZERO_UPSTREAM_DB: postgresql://${POSTGRES_USER:-sidestage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidestage}
      ZERO_CHANGE_DB: postgresql://${POSTGRES_USER:-sidestage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidestage}
      # Must match db/zero-publication.sql. The drift guard in
      # apps/api/src/sync/ asserts this publication covers the whole contract.
      ZERO_APP_PUBLICATIONS: zero_publication
      # On the named volume below — NOT the container filesystem. Losing this
      # only costs a re-sync, but a re-sync of the full ~3.5GB published set.
      ZERO_REPLICA_FILE: /data/zero/sidestage.db
      ZERO_QUERY_URL: http://api:3100/api/zero/query
      ZERO_MUTATE_URL: http://api:3100/api/zero/mutate
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?set in .env.production}
      # NO app/shard id is set here, DELIBERATELY — do not "helpfully" add one.
      # This line used to read `ZERO_SHARD_ID: ${ZERO_SHARD_ID:-sidestage}`, and
      # @rocicorp/zero 1.3 (the version libs/sync pins) REJECTS THAT KEY ITSELF:
      #   Error: ZERO_SHARD_ID is no longer an option. Please use ZERO_APP_ID instead.
      # It is rejected at CONFIG PARSE, before postgres is contacted, so
      # zero-cache crash-looped on prod at exit 255 without ever reaching a
      # preflight (observed 2026-08-17, WI-39710). No VALUE fixes it; the key is
      # gone. Note this is invisible to every test and to the green gate, because
      # nothing but a real prod deploy starts this compose file.
      #
      # And do NOT "fix" it by renaming to ZERO_APP_ID=sidestage. The app id names
      # zero's BOOKKEEPING SCHEMA, so that would move it from zero_0 — what the
      # ZERO_UPSTREAM_DB comment above documents — to sidestage_0. The DEFAULT app
      # id is the configuration that is actually proven: scripts/zero-cache-start.sh
      # (the dev path) exports no app/shard id at all, and the client
      # (libs/sync/src/transports/websocket/WebSocketAdapter.tsx, `new Zero({...})`)
      # passes no appID either. Server and client must agree, so leave this unset.
      # 12288MB is deliberate and must NOT be tuned down: the initial snapshot
      # of the published set (measured 3476 MB on 2026-08-17) OOMs a smaller
      # heap mid-sync and never converges. On Restart that produced 92920
      # container restarts in 30 days. The conservative-looking value is the
      # dangerous one here.
      NODE_OPTIONS: --max-old-space-size=${ZERO_HEAP_MB:-12288}
    volumes:
      - sidestage-zero-replica:/data/zero
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.sidestage-zero.rule=Host(`${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}`) && PathPrefix(`/zero`)
      # Must outrank the catch-all web router (priority 1) or the SPA swallows
      # the WebSocket upgrade and the client silently falls back to polling.
      - traefik.http.routers.sidestage-zero.priority=10
      - traefik.http.routers.sidestage-zero.entrypoints=https
      - traefik.http.routers.sidestage-zero.tls.certresolver=letsencrypt
      - traefik.http.services.sidestage-zero.loadbalancer.server.port=4848
      # A view-syncer connection is STATEFUL: each client must return to the
      # instance holding its materialized views. Without stickiness, scaling to
      # a second replica silently corrupts query results rather than erroring.
      - traefik.http.services.sidestage-zero.loadbalancer.sticky.cookie=true
      - traefik.http.services.sidestage-zero.loadbalancer.sticky.cookie.name=zero_instance
      - traefik.http.services.sidestage-zero.loadbalancer.sticky.cookie.secure=true
      - traefik.http.services.sidestage-zero.loadbalancer.sticky.cookie.httpOnly=true

  # Trusted queue consumer. It shares only the durable run ledger with the
  # public API and is never attached to Traefik or exposed on a host port.
  system-test-worker:
    image: sidestage-api:${SIDESTAGE_SHA:-latest}
    command: ["node", "apps/api/dist/system-tests/acceptance-worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SIDESTAGE_SHA: ${SIDESTAGE_SHA:-unknown}
      ACCEPTANCE_WORKER_PORT: 3101
      SYSTEM_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-sidestage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidestage}
      SYSTEM_TEST_MAX_CONCURRENT_RUNS: 1
      SYSTEM_TEST_MAX_ATTEMPTS: 2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 2s
      retries: 20

  web:
    # See the api service: per-sha tag keeps the previous release recoverable.
    image: sidestage-web:${SIDESTAGE_SHA:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}/api
        VITE_MEDIAMTX_URL: https://media.${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.sidestage-web.rule=Host(`${PUBLIC_HOSTNAME:-sidestage.buyrestart.com}`)
      - traefik.http.routers.sidestage-web.priority=1
      - traefik.http.routers.sidestage-web.entrypoints=https
      - traefik.http.routers.sidestage-web.tls.certresolver=letsencrypt
      - traefik.http.services.sidestage-web.loadbalancer.server.port=80
      # Legacy-domain continuity (WI-39411): after the papercusp.com migration the
      # old hostname 301s to the same path on the new one, so circulated links keep
      # working. Only correct once PUBLIC_HOSTNAME=sidestage.papercusp.com — this
      # deploys in the same step as that flip, never before it (pre-flip the legacy
      # rule would collide with the primary router on the same hostname).
      - traefik.http.routers.sidestage-web-legacy.rule=Host(`sidestage.buyrestart.com`)
      - traefik.http.routers.sidestage-web-legacy.entrypoints=https
      - traefik.http.routers.sidestage-web-legacy.tls.certresolver=letsencrypt
      - traefik.http.routers.sidestage-web-legacy.middlewares=sidestage-legacy-redirect
      - traefik.http.middlewares.sidestage-legacy-redirect.redirectregex.regex=^https://sidestage\.buyrestart\.com/(.*)
      - traefik.http.middlewares.sidestage-legacy-redirect.redirectregex.replacement=https://sidestage.papercusp.com/$${1}
      - traefik.http.middlewares.sidestage-legacy-redirect.redirectregex.permanent=true

networks:
  coolify:
    external: true

volumes:
  sidestage-postgres:
  sidestage-typesense:
  sidestage-redis:
  # zero-cache's SQLite replica of the published set. Sized for the measured
  # 3476 MB snapshot plus WAL headroom. Deleting it is recoverable but forces a
  # full re-sync, during which clients see stale data.
  sidestage-zero-replica:
