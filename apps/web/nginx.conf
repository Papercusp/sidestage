server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: tab/path URLs (/seller, /config, …) resolve to the shell.
  # The shell must always revalidate: without an explicit Cache-Control,
  # browsers heuristically cache index.html and keep serving OLD hashed asset
  # URLs after a deploy — users then run a stale bundle until a hard refresh
  # (bit the owner live on 2026-08-17, minutes after a fix had deployed).
  # no-cache still permits etag revalidation, so unchanged shells cost one 304.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
